<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <link rel="stylesheet" href="css/2416501053.css">

</head>
<body>

    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form action="#" method="post">
            <div class="form-group">
                <label for="etkinlik-adi">Etkinlik Adı</label>
                <input type="text" id="etkinlik-adi" name="etkinlik-adi" value="Kariyer Günleri 2026" required>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="seminer" selected>Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="konferans">Konferans</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tarih">Tarih / Saat</label>
                <input type="datetime-local" id="tarih" name="tarih" value="2026-10-12T14:00" required>
            </div>

            <div class="form-group">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4">Mezun söyleşileri ve şirket stantları.</textarea>
            </div>

            <div>
                <button type="submit">Güncelle</button>
            </div>
        </form>
    </main>

    <footer>
        <p>yiğit mercan · 2416501053 · 2026</p>
    </footer>

</body>
</html>
